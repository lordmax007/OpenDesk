# Blueprint do Render: New → Blueprint → escolha este repositório.
services:
  - type: web
    name: remoto
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TRUST_PROXY
        value: "1"
      # Opcional: TURN próprio (coturn) para redes que bloqueiam conexão direta
      # - key: TURN_URLS
      #   value: turn:turn.seudominio.com:3478?transport=udp,turns:turn.seudominio.com:5349?transport=tcp
      # - key: TURN_SECRET
      #   sync: false
